[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-analytics"
version = "0.1.0"
description = "Pull Garmin Connect activity data and get AI-driven training analytics from a local GUI"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "garminconnect>=0.2.19",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smart-analytics = "smart_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
